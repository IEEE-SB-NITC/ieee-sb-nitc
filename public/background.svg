<svg width="1440" height="3200" viewBox="0 0 1440 3200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top-right blob: #7b3a8c / #5a2d82 — behind hero heading (desktop) -->
  <g filter="url(#filter_blob1)">
    <ellipse cx="1240" cy="300" rx="540" ry="420" fill="url(#paint_blob1)"/>
  </g>
  <!-- Left-center blob: #5a2d82 — behind What's Ahead / Features (desktop) -->
  <g filter="url(#filter_blob2)">
    <ellipse cx="160" cy="1280" rx="500" ry="520" fill="url(#paint_blob2)"/>
  </g>
  <!-- Bottom-right accent: muted violet — behind Legacy / Events (desktop) -->
  <g filter="url(#filter_blob3)">
    <ellipse cx="1300" cy="2300" rx="420" ry="380" fill="url(#paint_blob3)"/>
  </g>
  <defs>
    <!-- Blob 1: violet-magenta top-right (matches #7b3a8c → rgb(169,113,119) palette) -->
    <filter id="filter_blob1" x="420" y="-380" width="1600" height="1360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="145" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_blob1" x1="760" y1="0" x2="1440" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7b3a8c"/>
      <stop offset="0.40" stop-color="#a64ac9"/>
      <stop offset="0.72" stop-color="rgb(169,113,119)"/>
      <stop offset="1" stop-color="#5a2d82" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Blob 2: deep site-purple left-center -->
    <filter id="filter_blob2" x="-600" y="520" width="1520" height="1520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="150" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_blob2" x1="-240" y1="780" x2="580" y2="1700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5a2d82"/>
      <stop offset="0.45" stop-color="#7b3a8c"/>
      <stop offset="0.80" stop-color="rgb(169,113,119)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5a2d82" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Blob 3: accent violet bottom-right -->
    <filter id="filter_blob3" x="620" y="1680" width="1360" height="1240" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="130" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_blob3" x1="980" y1="1980" x2="1440" y2="2600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7b2ff7" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7b3a8c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5a2d82" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
</svg>
