<svg width="430" height="5000" viewBox="0 0 430 5000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top-right pink/magenta blob — behind hero heading (mobile) -->
  <g filter="url(#filter_m_blob1)">
    <ellipse cx="370" cy="280" rx="300" ry="260" fill="url(#paint_m_blob1)"/>
  </g>
  <!-- Center-left purple blob — behind What's Ahead + Features (mobile) -->
  <g filter="url(#filter_m_blob2)">
    <ellipse cx="60" cy="1400" rx="280" ry="340" fill="url(#paint_m_blob2)"/>
  </g>
  <!-- Bottom-right subtle accent — Legacy/Events area (mobile) -->
  <g filter="url(#filter_m_blob3)">
    <ellipse cx="380" cy="3000" rx="260" ry="280" fill="url(#paint_m_blob3)"/>
  </g>
  <defs>
    <!-- Blob 1: pink/rose top-right -->
    <filter id="filter_m_blob1" x="-180" y="-200" width="1100" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="110" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_m_blob1" x1="80" y1="0" x2="430" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c94fa0"/>
      <stop offset="0.45" stop-color="#a3416f"/>
      <stop offset="0.78" stop-color="#7c2d82"/>
      <stop offset="1" stop-color="#5a1e6b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Blob 2: deep purple left-center -->
    <filter id="filter_m_blob2" x="-460" y="760" width="1040" height="1280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="120" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_m_blob2" x1="-200" y1="1000" x2="350" y2="1900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5F2E7F"/>
      <stop offset="0.5" stop-color="#7a3e9a"/>
      <stop offset="0.8" stop-color="#b09c8b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a35370" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Blob 3: subtle bottom-right accent -->
    <filter id="filter_m_blob3" x="-100" y="2480" width="960" height="1040" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_m_blob3" x1="150" y1="2750" x2="430" y2="3300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b2d8b" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#a35370" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3d1a5c" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
