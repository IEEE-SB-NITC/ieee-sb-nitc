<svg width="430" height="5000" viewBox="0 0 430 5000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top-right blob: site-purple/violet — behind hero heading (mobile) -->
  <g filter="url(#filter_m_blob1)">
    <ellipse cx="370" cy="270" rx="310" ry="260" fill="url(#paint_m_blob1)"/>
  </g>
  <!-- Left-center blob: deep site-purple — behind What's Ahead / Features (mobile) -->
  <g filter="url(#filter_m_blob2)">
    <ellipse cx="55" cy="1420" rx="290" ry="340" fill="url(#paint_m_blob2)"/>
  </g>
  <!-- Bottom-right accent — Legacy / Events area (mobile) -->
  <g filter="url(#filter_m_blob3)">
    <ellipse cx="390" cy="3100" rx="260" ry="270" fill="url(#paint_m_blob3)"/>
  </g>
  <defs>
    <!-- Blob 1: #7b3a8c → #a64ac9 → rgb(169,113,119) top-right -->
    <filter id="filter_m_blob1" x="-200" y="-210" width="1140" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="110" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_m_blob1" x1="70" y1="0" x2="430" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7b3a8c"/>
      <stop offset="0.40" stop-color="#a64ac9"/>
      <stop offset="0.72" stop-color="rgb(169,113,119)"/>
      <stop offset="1" stop-color="#5a2d82" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Blob 2: #5a2d82 → #7b3a8c left-center -->
    <filter id="filter_m_blob2" x="-480" y="780" width="1060" height="1280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="120" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_m_blob2" x1="-220" y1="1020" x2="340" y2="1980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5a2d82"/>
      <stop offset="0.45" stop-color="#7b3a8c"/>
      <stop offset="0.80" stop-color="rgb(169,113,119)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5a2d82" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Blob 3: #7b2ff7 bottom-right accent -->
    <filter id="filter_m_blob3" x="-110" y="2580" width="1000" height="1040" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_m_blob3" x1="160" y1="2860" x2="430" y2="3380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7b2ff7" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7b3a8c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5a2d82" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
</svg>
