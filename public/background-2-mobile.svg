<svg width="430" height="5000" viewBox="0 0 430 5000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left-side hero subtle accent (mobile) -->
  <g filter="url(#filter_ma_blob1)">
    <ellipse cx="-25" cy="520" rx="240" ry="220" fill="url(#paint_ma_blob1)"/>
  </g>
  <!-- Right mid-page accent (mobile) -->
  <g filter="url(#filter_ma_blob2)">
    <ellipse cx="455" cy="2280" rx="240" ry="260" fill="url(#paint_ma_blob2)"/>
  </g>
  <defs>
    <!-- Accent 1: subtle left-hero violet (mobile) -->
    <filter id="filter_ma_blob1" x="-505" y="80" width="960" height="880" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="110" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_ma_blob1" x1="-265" y1="300" x2="200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5a2d82" stop-opacity="0.48"/>
      <stop offset="0.55" stop-color="rgb(169,113,119)" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7b3a8c" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Accent 2: right mid-page (mobile) -->
    <filter id="filter_ma_blob2" x="5" y="1760" width="900" height="1040" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="110" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="paint_ma_blob2" x1="240" y1="2020" x2="455" y2="2640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7b2ff7" stop-opacity="0.48"/>
      <stop offset="0.50" stop-color="#a64ac9" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5a2d82" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
</svg>
